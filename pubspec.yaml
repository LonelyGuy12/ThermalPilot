name: thermal_pilot
description: "ThermalPilot: thermal-and-battery-aware on-device LLM inference scheduler."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # LLM inference via llama.cpp
  llama_cpp_dart: ^0.2.2

  # Charts
  fl_chart: ^0.70.2

  # File system paths
  path_provider: ^2.1.5

  # File sharing / export
  share_plus: ^10.0.0

  # Permissions (storage for file picker)
  permission_handler: ^11.3.1

  # Date/time formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
